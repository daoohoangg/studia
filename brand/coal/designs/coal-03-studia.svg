<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470" role="img" aria-label="Coal, kiểu 3: Xanh Studia"><style>.d-bob{animation:d-bob 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes d-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.d-eyes{animation:d-blink 4.6s infinite;transform-box:fill-box;transform-origin:50% 50%}
