<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470" role="img" aria-label="Coal, kiểu 1: Viền mực cổ điển"><style>.d-bob{animation:d-bob 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes d-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.d-eyes{animation:d-blink 4.6s infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes d-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.d-wave{animation:d-wave .9s ease-in-out infinite}
@keyframes d-wave{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.d-bob,.d-eyes,.d-wave{animation:none!important}}</style><rect width="400" height="470" rx="28" fill="#f1eee8"/>
