<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studia — Nhận diện thương hiệu</title>
<link rel="icon" href="logo/studia-app-icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Be+Vietnam+Pro:wght@400;600&display=swap">
<style>
  :root{--ink:#0F1F4D;--paper:#F8F6F2;--hair:#E5E0D8;--muted:#5E6480}
  *{box-sizing:border-box;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:'Be Vietnam Pro',sans-serif;padding:56px clamp(16px,5vw,72px) 96px}
  header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:48px}
  header img{height:32px}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  h2{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;letter-spacing:-.02em;margin:64px 0 20px;padding-top:20px;border-top:1px solid var(--hair)}
  .sheets{display:grid;gap:28px}
  .sheets img,.grid img{width:100%;display:block;border-radius:4px;box-shadow:0 1px 2px rgba(15,31,77,.06),0 12px 32px -12px rgba(15,31,77,.18)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px;align-items:start}
  figcaption{font-size:13px;color:var(--muted);margin-top:10px}
  .logos figure>div{aspect-ratio:16/9;display:grid;place-items:center;border:1px solid var(--hair);border-radius:4px;background:#fff}
  .logos .dk{background:var(--ink);border-color:var(--ink)}
  .logos img{box-shadow:none;width:auto;max-width:60%;max-height:40%;border-radius:0}
  a{color:inherit}
</style>
</head>
<body>
<header>
  <img src="logo/studia-lockup.svg" alt="Studia">
  <span class="eyebrow">Nhận diện thương hiệu · v1.0</span>
</header>

<div class="sheets">
  <img src="images/01-bia.png" alt="01 Bìa">
  <img src="images/02-y-niem.png" alt="02 Ý niệm">
  <img src="images/03-cau-truc.png" alt="03 Cấu trúc">
  <img src="images/04-bien-the-logo.png" alt="04 Biến thể logo">
  <img src="images/05-mau-sac.png" alt="05 Màu sắc">
  <img src="images/06-kieu-chu.png" alt="06 Kiểu chữ">
  <img src="images/07-hoa-tiet.png" alt="07 Hoạ tiết">
  <img src="images/08-bieu-tuong-ung-dung.png" alt="08 Biểu tượng ứng dụng">
  <img src="images/09-an-pham.png" alt="09 Ấn phẩm">
  <img src="images/10-ung-dung-so.png" alt="10 Ứng dụng số">
</div>

<h2>Ảnh mạng xã hội</h2>
<div class="grid">
  <figure><img src="images/og-image.png" alt=""><figcaption>og-image.png · 1200 × 630</figcaption></figure>
  <figure><img src="images/social-cover.png" alt=""><figcaption>social-cover.png · 1500 × 500</figcaption></figure>
  <figure><img src="images/social-post.png" alt=""><figcaption>social-post.png · 1080 × 1350</figcaption></figure>
  <figure><img src="images/social-avatar.png" alt=""><figcaption>social-avatar.png · 1080 × 1080</figcaption></figure>
</div>

<h2>Logo (SVG)</h2>
<div class="grid logos">
  <figure><div><img src="logo/studia-lockup.svg" alt=""></div><figcaption><a href="logo/studia-lockup.svg" download>studia-lockup.svg</a></figcaption></figure>
  <figure><div class="dk"><img src="logo/studia-lockup-reversed.svg" alt=""></div><figcaption><a href="logo/studia-lockup-reversed.svg" download>studia-lockup-reversed.svg</a></figcaption></figure>
  <figure><div><img src="logo/studia-lockup-mono.svg" alt=""></div><figcaption><a href="logo/studia-lockup-mono.svg" download>studia-lockup-mono.svg</a></figcaption></figure>
  <figure><div><img src="logo/studia-mark.svg" alt="" style="max-height:50%"></div><figcaption><a href="logo/studia-mark.svg" download>studia-mark.svg</a></figcaption></figure>
  <figure><div class="dk"><img src="logo/studia-mark-reversed.svg" alt="" style="max-height:50%"></div><figcaption><a href="logo/studia-mark-reversed.svg" download>studia-mark-reversed.svg</a></figcaption></figure>
  <figure><div><img src="logo/studia-mark-mono.svg" alt="" style="max-height:50%"></div><figcaption><a href="logo/studia-mark-mono.svg" download>studia-mark-mono.svg</a></figcaption></figure>
  <figure><div><img src="logo/studia-wordmark.svg" alt=""></div><figcaption><a href="logo/studia-wordmark.svg" download>studia-wordmark.svg</a></figcaption></figure>
  <figure><div class="dk"><img src="logo/studia-wordmark-reversed.svg" alt=""></div><figcaption><a href="logo/studia-wordmark-reversed.svg" download>studia-wordmark-reversed.svg</a></figcaption></figure>
  <figure><div><img src="logo/studia-app-icon.svg" alt="" style="max-height:60%"></div><figcaption><a href="logo/studia-app-icon.svg" download>studia-app-icon.svg</a></figcaption></figure>
</div>
</body>
</html>
