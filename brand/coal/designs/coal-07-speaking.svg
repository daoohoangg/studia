<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470" role="img" aria-label="Coal, kiểu 7: Luyện nói"><style>.d-bob{animation:d-bob 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
