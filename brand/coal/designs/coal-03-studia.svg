.d-wave{animation:d-wave .9s ease-in-out infinite}
@keyframes d-wave{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.d-bob,.d-eyes,.d-wave{animation:none!important}}</style><rect width="400" height="470" rx="28" fill="#dce5ff"/>
